apiVersion: v1
kind: Pod
metadata:
  name: pod-persistencia
spec:
  nodeSelector:
    kubernetes.io/hostname: ip-172-31-32-73
  containers:
    - name: contenedor
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: almacenamiento
          mountPath: /datos
  volumes:
    - name: almacenamiento
      persistentVolumeClaim:
        claimName: pvc-local-worker
